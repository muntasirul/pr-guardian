[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# module-level import ordering is intentional after the dotenv guard
"backend/cli/prguard.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
addopts = "-q"
markers = [
    "slow: slow tests (model download or CPU training)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
